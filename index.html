<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting CRM</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f7f9; --card:#ffffff; --ink:#16181d; --mut:#6b7280; --line:#e5e7eb;
  --red:#dc2626; --amb:#d97706; --blu:#2563eb; --grn:#059669; --gry:#9ca3af;
  --redbg:#fef2f2; --ambbg:#fffbeb; --blubg:#eff6ff; --grnbg:#ecfdf5; --grybg:#f3f4f6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
h1{font-size:21px;font-weight:650;letter-spacing:-.02em}
.gen{font-size:12px;color:var(--mut)}
.spacer{flex:1}
.sub{font-size:13px;color:var(--mut);margin-bottom:18px}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:5px 11px;font-size:12.5px;color:var(--mut)}
.ghost:hover{border-color:#c9ced6;color:var(--ink)}

/* ---------- attention strip ---------- */
.strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;min-width:112px}
.stat b{display:block;font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.stat.hot b{color:var(--red)} .stat.warm b{color:var(--amb)} .stat.good b{color:var(--grn)}

/* ---------- filters ---------- */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:5px 12px;font-size:12.5px;color:var(--mut);transition:.12s}
.chip:hover{border-color:#c9ced6;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{flex:1;min-width:170px;border:1px solid var(--line);background:var(--card);
  border-radius:8px;padding:7px 11px;font-size:13px;outline:none}
.search:focus{border-color:#b6bcc6}

/* ---------- client cards ---------- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:15px 16px 14px;text-align:left;position:relative;overflow:hidden;
  transition:.14s;display:flex;flex-direction:column;gap:11px;width:100%;cursor:pointer}
.cc:hover{border-color:#c9ced6;transform:translateY(-1px);
  box-shadow:0 6px 18px -8px rgba(16,24,40,.16)}
.cc:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.cc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gry)}
.cc.d-over::before,.cc.d-today::before{background:var(--red)}
.cc.d-soon::before{background:var(--amb)}
.cc.d-week::before{background:var(--blu)} .cc.d-far::before{background:var(--grn)}
.cc.d-done{opacity:.72}

.cc-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cc-n{font-size:16px;font-weight:640;letter-spacing:-.01em}
.cc-hr{display:flex;align-items:center;gap:6px;flex-shrink:0}
.dots{width:24px;height:24px;border-radius:6px;color:var(--gry);font-size:15px;
  line-height:1;display:flex;align-items:center;justify-content:center}
.dots:hover{background:var(--grybg);color:var(--ink)}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-red{background:var(--redbg);color:var(--red)} .p-amb{background:var(--ambbg);color:var(--amb)}
.p-blu{background:var(--blubg);color:var(--blu)} .p-grn{background:var(--grnbg);color:var(--grn)}
.p-gry{background:var(--grybg);color:#4b5563}

.cc-a{background:#fafbfc;border:1px solid var(--line);border-radius:9px;padding:10px 11px}
.lbl{font-size:10.5px;font-weight:650;color:var(--mut);text-transform:uppercase;
  letter-spacing:.07em;margin-bottom:3px}
.act{font-size:14px;font-weight:550;line-height:1.35}
.act.struck{text-decoration:line-through;color:var(--mut);font-weight:500}
.cc-m{display:flex;gap:16px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.cc-m b{color:var(--ink);font-weight:550}
.due{font-weight:600}
.due.over{color:var(--red)} .due.soon{color:var(--amb)}
.cc-s{font-size:12.5px;color:var(--mut);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-f{display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-top:1px solid var(--line);padding-top:9px;font-size:11.5px;color:var(--mut)}
.stage{font-size:11.5px;font-weight:600;color:#4b5563}
.snz{font-size:10.5px;color:var(--blu);font-weight:600}

/* ---------- client detail ---------- */
.back{font-size:13px;color:var(--mut);margin-bottom:14px}
.back:hover{color:var(--ink)}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  flex-wrap:wrap;margin-bottom:14px}
.dh h2{font-size:25px;font-weight:660;letter-spacing:-.025em}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));
  margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi.wide{grid-column:1/-1}
.kpi .ro{font-size:14px;font-weight:580;margin-top:3px;line-height:1.35}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;
  overflow-x:auto}
.tab{padding:8px 13px;font-size:13px;color:var(--mut);border-bottom:2px solid transparent;
  white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tab i{font-style:normal;font-size:11px;color:var(--mut);margin-left:5px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;margin-bottom:12px}
.panel h3{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;
  color:var(--mut);margin-bottom:11px}
ul.b{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.b li{padding-left:15px;position:relative;font-size:13.5px;line-height:1.5}
ul.b li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;
  border-radius:50%;background:#c3c8d0}
ul.b.risk li::before{background:var(--red)}
ul.b.dec li::before{background:var(--grn)}
.src{font-size:11.5px;color:var(--gry);margin-left:7px}

/* ---------- inline editing ---------- */
.ed{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;
  padding:4px 6px;margin:-4px -6px;font-size:14px;font-weight:550;outline:none;
  transition:.12s;line-height:1.35}
.ed:hover{border-color:var(--line);background:#fafbfc}
.ed:focus{border-color:var(--blu);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.09)}
.ed.sm{font-size:13px;font-weight:500}
textarea.ed{resize:vertical;min-height:52px;font-weight:500;font-size:13.5px;
  color:var(--mut);line-height:1.55}
select.ed{appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%239ca3af' stroke-width='1.6'/></svg>");
  background-repeat:no-repeat;background-position:right 6px center;padding-right:22px}
input[type=date].ed{cursor:pointer}
.quick{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.qb{border:1px solid var(--line);background:#fafbfc;border-radius:6px;padding:2px 7px;
  font-size:11px;color:var(--mut);font-weight:550}
.qb:hover{border-color:var(--blu);color:var(--blu);background:var(--blubg)}
.donebtn{border:1px solid var(--line);background:#fafbfc;border-radius:6px;padding:3px 9px;
  font-size:11.5px;color:var(--mut);font-weight:600;margin-top:8px}
.donebtn:hover{border-color:var(--grn);color:var(--grn);background:var(--grnbg)}
.donebtn.on{border-color:var(--grn);color:var(--grn);background:var(--grnbg)}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:18px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;
  border-radius:50%;background:var(--card);border:2px solid var(--blu)}
.tl-d{font-size:11.5px;color:var(--mut);font-weight:550}
.tl-t{font-size:14px;font-weight:580;margin:1px 0 4px}
.tl-s{font-size:13px;color:var(--mut);line-height:1.5}

/* meeting accordion */
.mt{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:var(--card);
  overflow:hidden}
.mt-h{display:flex;align-items:center;gap:11px;padding:13px 15px;width:100%;text-align:left}
.mt-h:hover{background:#fafbfc}
.mt-dt{font-size:11.5px;color:var(--mut);font-weight:600;min-width:78px}
.mt-nm{flex:1;font-size:13.5px;font-weight:560}
.mt-b{padding:0 15px 15px;border-top:1px solid var(--line);padding-top:14px;
  display:flex;flex-direction:column;gap:15px}
.mt-b h4{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;
  color:var(--mut);margin-bottom:7px}
.caret{color:var(--gry);font-size:11px;transition:transform .15s}
.mt.open .caret{transform:rotate(90deg)}
.ro-note{font-size:11px;color:var(--gry);font-style:italic}

/* actions table */
.at{width:100%;border-collapse:collapse;font-size:13px}
.at th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--mut);font-weight:650;padding:0 8px 7px 0;border-bottom:1px solid var(--line)}
.at td{padding:5px 8px 5px 0;border-bottom:1px solid #f1f2f4;vertical-align:middle}
.at tr:last-child td{border-bottom:0}
.at .cbx{width:26px;padding-right:0}
.at .ow{color:var(--mut);white-space:nowrap;font-size:12.5px}
.at tr.isdone .ed,.at tr.isdone .ow{color:var(--mut)}
.at tr.isdone input.ed[data-f="action"]{text-decoration:line-through}
.at input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--grn)}
.at td .ed{min-width:70px}
.at td.act-c{width:52%}
.tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}

pre.tr{background:#fafbfc;border:1px solid var(--line);border-radius:9px;padding:12px;
  font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;
  max-height:420px;overflow:auto;color:#374151}
.empty{color:var(--mut);font-size:13.5px;padding:6px 0}
.stale{position:absolute;left:0;right:0;bottom:0;background:var(--ambbg);color:var(--amb);
  font-size:10.5px;font-weight:600;text-align:center;padding:3px}
.cc:has(.stale){padding-bottom:24px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ambbg);
  border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 13px;
  font-size:12.5px;margin-bottom:12px}
.banner span{flex:1;min-width:200px;line-height:1.5}
.hide{display:none!important}
.foot{margin-top:26px;font-size:11.5px;color:var(--gry);text-align:center}

/* popover + modal + toast */
.pop{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);
  border-radius:11px;box-shadow:0 12px 34px -10px rgba(16,24,40,.28);padding:9px;
  min-width:236px;max-width:290px;display:flex;flex-direction:column;gap:3px}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.pop .ph{font-size:10px;font-weight:650;color:var(--mut);text-transform:uppercase;
  letter-spacing:.07em;padding:4px 7px 2px}
.mi{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;
  font-size:13px;text-align:left;width:100%}
.mi:hover{background:var(--grybg)}
.mi.dg:hover{background:var(--redbg);color:var(--red)}
.pop .row{display:flex;gap:4px;flex-wrap:wrap;padding:2px 6px 5px}
.pop select,.pop input[type=date]{width:100%;border:1px solid var(--line);border-radius:7px;
  padding:6px 8px;font-size:13px;background:#fff;outline:none;margin:0 0 2px}
.ovl{position:fixed;inset:0;background:rgba(16,24,40,.34);z-index:70;
  display:flex;align-items:center;justify-content:center;padding:22px}
.mdl{background:var(--card);border-radius:14px;padding:20px;max-width:560px;width:100%;
  box-shadow:0 22px 50px -14px rgba(16,24,40,.4)}
.mdl h3{font-size:15px;font-weight:640;margin-bottom:7px}
.mdl p{font-size:13px;color:var(--mut);margin-bottom:13px;line-height:1.55}
.mdl textarea{width:100%;height:190px;border:1px solid var(--line);border-radius:9px;
  padding:10px;font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.mdl .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 13px;
  font-size:13px;font-weight:550}
.btn:hover{border-color:#c9ced6}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dg{border-color:var(--red);color:var(--red)}
.btn.dg:hover{background:var(--redbg)}
.toast{position:fixed;bottom:20px;right:20px;z-index:90;background:var(--ink);color:#fff;
  border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:550;opacity:0;
  transform:translateY(6px);transition:.18s;pointer-events:none}
.toast.on{opacity:1;transform:translateY(0)}
@media(max-width:600px){
  .wrap{padding:16px 13px 60px}
  .at td.act-c{width:auto}
  .at{font-size:12.5px}
}
</style>
</head>

/* ---------- constants ---------- */
const STAGES = ["Discovery","Qualification","Scoping","Proposal","Proposal Sent",
  "Negotiation","Pilot","Implementation","Closed Won","Closed Lost","On Hold"];
const STATUSES = ["Needs Attention","Waiting on Client","Waiting on Us","In Progress",
  "Follow-up Scheduled","On Hold","Completed","No Response"];
const ASTATUS = ["Not Started","In Progress","Waiting","Done","Cancelled"];
const CLOSED_A = ["Done","Cancelled"];

const NOW = new Date();
const TODAY = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================================================
   LOCAL STORE  (overlay only - never mutates DATA)
   ============================================================ */
const LS = "meetingcrm.v1";
let store = loadStore();

function loadStore(){
  try{
    const r = JSON.parse(localStorage.getItem(LS) || "{}");
    return {clients: r.clients || {}, actions: r.actions || {}, updated: r.updated || null};
  }catch(e){ return {clients:{}, actions:{}, updated:null}; }
}
function persist(msg){
  store.updated = new Date().toISOString();
  try{
    localStorage.setItem(LS, JSON.stringify(store));
    toast(msg || "Saved");
  }catch(e){ toast("Could not save locally"); }
}
function setC(name, patch, msg){
  const base = (DATA.clients.find(c => c.Client === name) || {}).Updated || "";
  store.clients[name] = Object.assign({_base: base}, store.clients[name], patch, {_base: base});
  persist(msg);
}
/* A newer meeting was processed into the CSVs after these local edits were made. */
function isStale(name){
  const emb = DATA.clients.find(c => c.Client === name);
  const ov = store.clients[name];
  return !!(emb && ov && ov._base && emb.Updated && emb.Updated > ov._base);
}
/* Drop pipeline-owned overrides, keep the human scratchpad. */
function refreshFromCsv(name){
  const ov = store.clients[name] || {};
  const keep = {};
  if(ov.Notes) keep.Notes = ov.Notes;
  store.clients[name] = keep;
  persist("Refreshed from latest meeting");
}
function setA(key, patch, msg){
  store.actions[key] = Object.assign({}, store.actions[key], patch);
  persist(msg);
}

/* effective (embedded + overlay) */
const clientsAll = () =>
  DATA.clients.map(c => Object.assign({}, c, store.clients[c.Client] || {}));
const getClient = n => clientsAll().find(c => c.Client === n);

const meetingsOf = n => DATA.meetings
  .filter(m => m.client.toLowerCase() === String(n).toLowerCase())
  .sort((a,b) => b.date.localeCompare(a.date));

function actsOf(m){
  return m.actions.map((a,i) => {
    const k = m.id + "#" + i;
    const o = store.actions[k] || {};
    const r = Object.assign({status:"Not Started", owner:"Unassigned", due:"", action:""}, a, o);
    r._k = k; r._mid = m.id; r._mdate = m.date; r._mname = m.name;
    return r;
  });
}
const allActs = n => meetingsOf(n).flatMap(actsOf);
const isOpenA = a => !CLOSED_A.includes(a.status);
const openActs = n => allActs(n).filter(isOpenA);
const doneActs = n => allActs(n).filter(a => !isOpenA(a));

/* ============================================================
   DATES + URGENCY
   ============================================================ */
function iso(d){ return d.getFullYear() + "-" +
  String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function plusDays(n){ const d = new Date(TODAY); d.setDate(d.getDate()+n); return iso(d); }
function plusMonths(n){ const d = new Date(TODAY); d.setMonth(d.getMonth()+n); return iso(d); }
function days(d){
  if(!d) return null;
  const t = new Date(d + "T00:00:00");
  if(isNaN(t)) return null;
  return Math.round((t - TODAY) / 86400000);
}
function fmt(d){
  if(!d) return "Not set";
  const t = new Date(d + "T00:00:00");
  if(isNaN(t)) return d;
  return t.toLocaleDateString("en-US",{month:"short",day:"numeric",
    year: t.getFullYear()===TODAY.getFullYear() ? undefined : "numeric"});
}
function rel(n){
  if(n === null) return "";
  if(n < 0) return Math.abs(n) + "d overdue";
  if(n === 0) return "today";
  if(n === 1) return "tomorrow";
  if(n <= 30) return "in " + n + "d";
  return "in " + Math.round(n/30) + "mo";
}
function ago(isoTs){
  if(!isoTs) return "";
  const s = Math.round((Date.now() - new Date(isoTs)) / 1000);
  if(s < 60) return "just now";
  if(s < 3600) return Math.round(s/60) + " min ago";
  if(s < 86400) return Math.round(s/3600) + "h ago";
  return Math.round(s/86400) + "d ago";
}

const isClosed = c => /^Closed/.test(c.Stage || "") || c.Status === "Completed";

/* buckets drive both colour and sort order */
function urgency(c){
  if(isClosed(c)) return "done";
  const n = days(c["Next Follow-up"]);
  if(n === null) return "none";
  if(n < 0)  return "over";
  if(n === 0) return "today";
  if(n <= 2) return "soon";
  if(n <= 7) return "week";
  return "far";
}
const RANK = {over:0, today:1, soon:2, week:3, far:4, none:5, done:6};

/* Needs Attention:
   never when closed or snoozed into the future.
   always when status is Needs Attention, or the follow-up is overdue.
   otherwise only if it is due within 2 days and there is still work to do. */
function attention(c){
  if(isClosed(c)) return false;
  const snz = c.snoozedUntil;
  if(snz && days(snz) > 0 && c.Status !== "Needs Attention") return false;
  if(c.Status === "Needs Attention") return true;
  const n = days(c["Next Follow-up"]);
  if(n !== null && n < 0) return true;
  const hasWork = openActs(c.Client).length > 0 || !c.nextActionDone;
  return n !== null && n <= 2 && hasWork;
}

const STATUS_TONE = s => {
  s = (s || "").toLowerCase();
  if(/needs attention|lost|stalled|at risk|blocked|no response/.test(s)) return "p-red";
  if(/waiting on client|pending|on hold|awaiting/.test(s)) return "p-amb";
  if(/won|signed|live|proposal sent|completed|follow-up scheduled/.test(s)) return "p-grn";
  if(/in progress|waiting on us|discovery|qualif|scoping|intro/.test(s)) return "p-blu";
  return "p-gry";
};

const toastEl = document.getElementById("toast");
let toastT;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove("on"), 1600);
}

let popEl = null;
function closePop(){ if(popEl){ popEl.remove(); popEl = null;
  document.removeEventListener("mousedown", outside, true);
  document.removeEventListener("keydown", onEsc, true); } }
function outside(e){ if(popEl && !popEl.contains(e.target)) closePop(); }
function onEsc(e){ if(e.key === "Escape") closePop(); }
function openPop(x, y, html, wire){
  closePop();
  popEl = document.createElement("div");
  popEl.className = "pop";
  popEl.innerHTML = html;
  document.body.appendChild(popEl);
  const r = popEl.getBoundingClientRect();
  popEl.style.left = Math.max(8, Math.min(x, innerWidth  - r.width  - 8)) + "px";
  popEl.style.top  = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + "px";
  if(wire) wire(popEl);
  setTimeout(() => {
    document.addEventListener("mousedown", outside, true);
    document.addEventListener("keydown", onEsc, true);
  }, 0);
}

let ovl = null;
function closeModal(){ if(ovl){ ovl.remove(); ovl = null; } }
function modal(html, wire){
  closeModal();
  ovl = document.createElement("div");
  ovl.className = "ovl";
  ovl.innerHTML = '<div class="mdl">' + html + '</div>';
  ovl.addEventListener("mousedown", e => { if(e.target === ovl) closeModal(); });
  document.body.appendChild(ovl);
  if(wire) wire(ovl);
}

    <div class="stat ${nWeek?"warm":""}"><b>${nWeek}</b><span>Due this week</span></div>

  </div>
  <div class="bar">
    ${chip("attention","Needs attention")}${chip("week","This week")}

  const u = urgency(c), n = days(c["Next Follow-up"]);

    <div class="cc-h">
      <span class="cc-n">${esc(c.Client)}</span>

    p.querySelectorAll("[data-d]").forEach(b => b.onclick = () => fu(plusDays(+b.dataset.d)));
    p.querySelectorAll("[data-m]").forEach(b => b.onclick = () => fu(plusMonths(+b.dataset.m)));
    p.querySelectorAll("[data-s]").forEach(b => b.onclick = () => sn(plusDays(+b.dataset.s)));
    p.querySelectorAll("[data-sm]").forEach(b => b.onclick = () => sn(plusMonths(+b.dataset.sm)));
    p.querySelector('[data-r="fu"]').onchange = e => e.target.value && fu(e.target.value);

  });
}

  <div class="kpis">
    <div class="kpi"><div class="lbl">Stage</div>
      <select class="ed" data-c="Stage">${opt(STAGES, c.Stage)}</select></div>
    <div class="kpi"><div class="lbl">Status</div>
      <select class="ed" data-c="Status">${opt(STATUSES, c.Status)}</select></div>
    <div class="kpi"><div class="lbl">Action owner</div>
      <input class="ed" data-c="Action Owner" value="${esc(c["Action Owner"] || "")}"
        placeholder="Us / Client / Both"></div>
    <div class="kpi"><div class="lbl">Last meeting <span class="ro-note">read-only</span></div>
      <div class="ro">${fmt(c["Last Meeting"])}</div></div>

    <div class="kpi wide"><div class="lbl">Next follow-up
      ${n !== null && !isClosed(c) ? `<span class="src ${n<0?"due over":""}">${rel(n)}</span>` : ""}
      ${c.snoozedUntil && days(c.snoozedUntil) > 0 ?
        `<span class="snz">snoozed</span>` : ""}</div>
      <input type="date" class="ed" data-c="Next Follow-up" value="${esc(c["Next Follow-up"]||"")}">
      <div class="quick">
        <button class="qb" data-d="1">Tomorrow</button>
        <button class="qb" data-d="7">In 1 week</button>
        <button class="qb" data-d="14">In 2 weeks</button>
        <button class="qb" data-m="1">In 1 month</button>
        <span style="width:8px"></span>
        <button class="qb" data-s="1">Snooze 1d</button>
        <button class="qb" data-s="7">1w</button>
        <button class="qb" data-s="14">2w</button>
        <button class="qb" data-sm="1">1mo</button>
      </div></div>

    <div class="kpi wide"><div class="lbl">Next action</div>
      <input class="ed" data-c="Next Action" value="${esc(c["Next Action"] || "")}"
        placeholder="One imperative action">
      <button class="donebtn ${c.nextActionDone ? "on" : ""}" id="nad">
        ${c.nextActionDone ? "&#10003; Done - click to reopen" : "Mark done"}</button></div>

    <div class="kpi wide"><div class="lbl">Client summary</div>
      <textarea class="ed" data-c="Summary"
        placeholder="Where the opportunity stands right now">${esc(c.Summary || "")}</textarea></div>

    <div class="kpi wide"><div class="lbl">Quick notes</div>
      <textarea class="ed" data-c="Notes"
        placeholder="Scratchpad - reminders, context, anything">${esc(c.Notes || "")}</textarea></div>
  </div>

  <div class="tabs">${TABS.map(([k,l,ct]) =>
    `<button class="tab ${view.tab===k?"on":""}" data-t="${k}">${l}${ct!==""?`<i>${ct}</i>`:""}</button>`
  ).join("")}</div>
  <div id="body"></div>`;

  document.getElementById("bk").onclick = () => { view.page = "home"; render(); };
  app.querySelectorAll("[data-t]").forEach(b =>
    b.onclick = () => { view.tab = b.dataset.t; render(); });

  wireClientFields(c);
  renderTab(c, {ms, oActs, dActs, risks, decs, qs, trs});
  window.scrollTo(0,0);
}

/* ---------- autosaving field wiring ---------- */
let deb;
function wireClientFields(c){
  const name = c.Client;

  app.querySelectorAll("[data-c]").forEach(el => {
    const f = el.dataset.c;
    if(el.tagName === "SELECT" || el.type === "date"){
      el.onchange = () => {
        const patch = {}; patch[f] = el.value;
        if(f === "Next Follow-up") patch.snoozedUntil = "";
        setC(name, patch, f + " updated");
        render();
      };
    } else {
      el.oninput = () => {
        clearTimeout(deb);
        const v = el.value;
        deb = setTimeout(() => {
          const patch = {}; patch[f] = v;
          if(f === "Next Action") patch.nextActionDone = false;
          setC(name, patch);
        }, 450);
      };
      el.onblur = () => {
        clearTimeout(deb);
        const patch = {}; patch[f] = el.value;
        if(f === "Next Action") patch.nextActionDone = false;
        setC(name, patch);
      };
    }
  });

  const fu = d => { setC(name, {"Next Follow-up": d, snoozedUntil: ""}, "Follow-up set"); render(); };
  const sn = d => { const patch = {"Next Follow-up": d, snoozedUntil: d};
    if(c.Status === "Needs Attention") patch.Status = "Follow-up Scheduled";
    setC(name, patch, "Snoozed to " + fmt(d)); render(); };

  app.querySelectorAll(".quick [data-d]").forEach(b => b.onclick = () => fu(plusDays(+b.dataset.d)));
  app.querySelectorAll(".quick [data-m]").forEach(b => b.onclick = () => fu(plusMonths(+b.dataset.m)));
  app.querySelectorAll(".quick [data-s]").forEach(b => b.onclick = () => sn(plusDays(+b.dataset.s)));
  app.querySelectorAll(".quick [data-sm]").forEach(b => b.onclick = () => sn(plusMonths(+b.dataset.sm)));

  const rf = document.getElementById("refresh");
  if(rf) rf.onclick = () => { refreshFromCsv(name); render(); };

  document.getElementById("nad").onclick = () => {
    setC(name, {nextActionDone: !c.nextActionDone},
      c.nextActionDone ? "Reopened" : "Next action done");
    render();
  };
}

/* ---------- tabs ---------- */
function renderTab(c, d){
  const b = document.getElementById("body");
  const list = (arr, cls) => arr.length
    ? `<ul class="b ${cls||""}">${arr.map(x =>
        `<li>${esc(x.t)}<span class="src">${fmt(x.d)}</span></li>`).join("")}</ul>`
    : `<p class="empty">Nothing recorded.</p>`;

  if(view.tab === "overview"){
    const last = d.ms[0];
    b.innerHTML = `
      <div class="panel"><h3>Where things stand <span class="ro-note">from the last meeting</span></h3>
        ${last ? `<ul class="b">${last.summary.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
          <p class="src" style="margin-top:9px">${esc(last.name)} · ${fmt(last.date)}</p>`
        : `<p class="empty">No meetings logged yet.</p>`}</div>
      <div class="panel"><h3>Outstanding actions (${d.oActs.length})</h3>
        ${actionTable(d.oActs)}</div>
      <div class="panel"><h3>Live risks (${d.risks.length})</h3>${list(d.risks,"risk")}</div>
      <div class="panel"><h3>Open questions (${d.qs.length})</h3>${list(d.qs)}</div>`;
  }
  else if(view.tab === "timeline"){
    b.innerHTML = `<div class="panel"><div class="tl">${d.ms.map(m => `
      <div class="tl-i"><div class="tl-d">${fmt(m.date)} · ${esc(m.type)}</div>
        <div class="tl-t">${esc(m.name)}</div>
        <div class="tl-s">${esc(m.summary[0] || "")}</div></div>`).join("")
      || `<p class="empty">No meetings yet.</p>`}</div></div>`;
  }
  else if(view.tab === "meetings"){
    b.innerHTML = d.ms.map(meetingBlock).join("") || `<p class="empty">No meetings yet.</p>`;
    b.querySelectorAll(".mt-h").forEach(h => h.onclick = () => {
      const p = h.parentElement;
      p.classList.toggle("open");
      p.querySelector(".mt-b").classList.toggle("hide");
      view.openMeetings[p.dataset.m] = p.classList.contains("open");
    });
  }
  else if(view.tab === "actions"){
    b.innerHTML = `<div class="panel"><h3>Outstanding actions (${d.oActs.length})</h3>
      ${actionTable(d.oActs, true)}</div>`;
  }
  else if(view.tab === "completed"){
    b.innerHTML = `<div class="panel">
      <h3>Completed &amp; cancelled (${d.dActs.length})</h3>
      <p class="src" style="margin:-6px 0 11px 0;display:block">Nothing is ever deleted. Untick to reopen.</p>
      ${actionTable(d.dActs, true)}</div>`;
  }
  else if(view.tab === "risks"){
    b.innerHTML = `<div class="panel"><h3>Risks &amp; blockers
      <span class="ro-note">read-only</span></h3>${list(d.risks,"risk")}</div>`;
  }
  else if(view.tab === "decisions"){
    b.innerHTML = `<div class="panel"><h3>Confirmed decisions
      <span class="ro-note">read-only</span></h3>${list(d.decs,"dec")}</div>`;
  }
  else {
    b.innerHTML = d.trs.length ? d.trs.map(m => `<div class="panel">
      <h3>${fmt(m.date)} · ${esc(m.name)}</h3>
      <p class="empty" style="padding:0">Stored at <code>${esc(m.transcript)}</code></p>
      </div>`).join("") : `<p class="empty">No transcripts archived.</p>`;
  }
  wireActions();
}

/* ---------- editable action table ---------- */
function actionTable(acts, showSource){
  if(!acts.length) return `<p class="empty">Nothing here.</p>`;
  return `<table class="at"><thead><tr>
      <th class="cbx"></th><th>Action</th><th>Owner</th><th>Due</th><th>Status</th>
      ${showSource ? "<th>From</th>" : ""}</tr></thead><tbody>
    ${acts.map(a => {
      const done = !isOpenA(a);
      return `<tr class="${done ? "isdone" : ""}" data-k="${esc(a._k)}">
        <td class="cbx"><input type="checkbox" data-f="done"${a.status === "Done" ? " checked" : ""}
          title="Mark done"></td>
        <td class="act-c"><input class="ed sm" data-f="action" value="${esc(a.action)}"></td>
        <td><input class="ed sm" data-f="owner" value="${esc(a.owner)}" size="12"></td>
        <td><input type="date" class="ed sm" data-f="due" value="${esc(a.due || "")}"></td>
        <td><select class="ed sm" data-f="status">${opt(ASTATUS, a.status)}</select></td>
        ${showSource ? `<td class="ow">${fmt(a._mdate)}</td>` : ""}
      </tr>`;
    }).join("")}</tbody></table>`;
}

function wireActions(){
  app.querySelectorAll("tr[data-k]").forEach(tr => {
    const k = tr.dataset.k;
    tr.querySelectorAll("[data-f]").forEach(el => {
      const f = el.dataset.f;
      if(f === "done"){
        el.onchange = () => {
          setA(k, {status: el.checked ? "Done" : "Not Started"},
            el.checked ? "Marked done" : "Reopened");
          render();
        };
      } else if(f === "status"){
        el.onchange = () => { setA(k, {status: el.value}, "Status updated"); render(); };
      } else if(f === "due"){
        el.onchange = () => setA(k, {due: el.value}, "Due date updated");
      } else {
        let t;
        el.oninput = () => { clearTimeout(t); const v = el.value;
          t = setTimeout(() => { const p = {}; p[f] = v; setA(k, p); }, 450); };
        el.onblur = () => { clearTimeout(t); const p = {}; p[f] = el.value; setA(k, p); };
      }
    });
  });
}

/* ---------- meeting block (read-only history) ---------- */
function meetingBlock(m){
  const sec = (t, arr, cls) => arr && arr.length
    ? `<div><h4>${t}</h4><ul class="b ${cls||""}">${arr.map(x =>
        `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  const isOpen = !!view.openMeetings[m.id];
  return `<div class="mt ${isOpen ? "open" : ""}" data-m="${esc(m.id)}"><button class="mt-h">
      <span class="caret">&#9654;</span>
      <span class="mt-dt">${fmt(m.date)}</span>
      <span class="mt-nm">${esc(m.name)}</span>
      <span class="pill p-gry">${esc(m.type)}</span></button>
    <div class="mt-b ${isOpen ? "" : "hide"}">
      ${sec("Executive summary", m.summary)}
      ${m.participants.length ? `<div><h4>Participants</h4><ul class="b">${
        m.participants.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>` : ""}
      ${sec("Key topics", m.topics)}
      ${sec("Confirmed decisions", m.decisions, "dec")}
      ${m.actions.length ? `<div><h4>Action items <span class="ro-note">editable</span></h4>
        ${actionTable(actsOf(m))}</div>` : ""}
      ${sec("Risks &amp; blockers", m.risks, "risk")}
      ${sec("Open questions", m.questions)}
      ${sec("Notes", m.notes)}
      ${m.transcript ? `<div><h4>Transcript</h4>
        <p class="empty" style="padding:0"><code>${esc(m.transcript)}</code></p></div>` : ""}
    </div></div>`;
}

/* ============================================================
   DATA MENU - export / import / reset
   ============================================================ */
function dataMenu(ev){
  const r = ev.currentTarget.getBoundingClientRect();
  openPop(r.right - 236, r.bottom + 6, `
    <div class="ph">Local edits</div>
    <button class="mi" data-a="exp">&#8681; Export backup (JSON)</button>
    <button class="mi" data-a="imp">&#8679; Import backup</button>
    <hr>
    <button class="mi dg" data-a="rst">&#8635; Reset local changes</button>
    <div class="ph" style="padding-top:6px;font-weight:500;text-transform:none;letter-spacing:0">
      ${store.updated ? "Last saved " + ago(store.updated) : "No local edits yet"}</div>`,
  p => {
    p.querySelector('[data-a="exp"]').onclick = () => { closePop(); exportBackup(); };
    p.querySelector('[data-a="imp"]').onclick = () => { closePop(); importBackup(); };
    p.querySelector('[data-a="rst"]').onclick = () => { closePop(); resetLocal(); };
  });
}

function backupBlob(){
  return JSON.stringify({
    _format: "meeting-crm-backup",
    _version: 1,
    exported: new Date().toISOString(),
    clients: store.clients,
    actions: store.actions,
    updated: store.updated
  }, null, 2);
}

function exportBackup(){
  const json = backupBlob();
  const fname = "meeting-crm-backup-" + iso(TODAY) + ".json";
  let downloaded = false;
  try{
    const url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    downloaded = true;
  }catch(e){ downloaded = false; }

  modal(`<h3>Backup</h3>
    <p>${downloaded ? "Downloaded as <code>" + fname + "</code>. "
      : ""}If the download did not start, copy the JSON below and save it yourself.</p>
    <textarea id="bk" readonly>${esc(json)}</textarea>
    <div class="btns"><button class="btn" id="cp">Copy</button>
      <button class="btn pri" id="cl">Done</button></div>`, o => {
    o.querySelector("#cp").onclick = () => {
      const ta = o.querySelector("#bk");
      ta.select(); ta.setSelectionRange(0, ta.value.length);
      try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Select and copy manually"); }
    };
    o.querySelector("#cl").onclick = closeModal;
  });
}

function importBackup(){
  modal(`<h3>Import backup</h3>
    <p>Choose an exported JSON file, or paste its contents below. This replaces your current
       local edits. Meeting history is never affected.</p>
    <input type="file" id="f" accept="application/json,.json" style="margin-bottom:11px">
    <textarea id="ta" placeholder="…or paste backup JSON here"></textarea>
    <div class="btns"><button class="btn" id="cx">Cancel</button>
      <button class="btn pri" id="go">Restore</button></div>`, o => {
    const ta = o.querySelector("#ta");
    o.querySelector("#f").onchange = e => {
      const file = e.target.files[0];
      if(!file) return;
      const fr = new FileReader();
      fr.onload = () => { ta.value = fr.result; };
      fr.readAsText(file);
    };
    o.querySelector("#cx").onclick = closeModal;
    o.querySelector("#go").onclick = () => {
      let d;
      try{ d = JSON.parse(ta.value); }
      catch(err){ return toast("That is not valid JSON"); }
      if(!d || typeof d !== "object" || (!d.clients && !d.actions))
        return toast("Not a Meeting CRM backup");
      store = {clients: d.clients || {}, actions: d.actions || {}, updated: null};
      persist("Backup restored");
      closeModal();
      view.page = "home";
      render();
    };
  });
}

function resetLocal(){
  modal(`<h3>Reset local changes?</h3>
    <p>This clears every edit saved in this browser - action statuses, stages, follow-up dates,
       notes and snoozes - and restores the dashboard to the data generated from your CSVs.
       <b>Meeting history, decisions, risks and transcripts are not touched.</b>
       Export a backup first if you might want these edits back.</p>
    <div class="btns"><button class="btn" id="cx">Cancel</button>
      <button class="btn" id="ex">Export first</button>
      <button class="btn dg" id="go">Reset everything</button></div>`, o => {
    o.querySelector("#cx").onclick = closeModal;
    o.querySelector("#ex").onclick = () => { closeModal(); exportBackup(); };
    o.querySelector("#go").onclick = () => {
      store = {clients:{}, actions:{}, updated:null};
      try{ localStorage.removeItem(LS); }catch(e){}
      closeModal();
      toast("Local changes cleared");
      view = {page:"home", client:null, tab:"overview", filter:"all", q:"", openMeetings:{}};
      render();
    };
  });
}

/* ============================================================ */
render();
</script>
</body>
</html>
