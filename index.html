function glassesView(){
  const total = glasses.length;
  const del = glasses.filter(g => g.delivered === "Yes").length;
  const bk  = glasses.filter(g => g.booked === "Yes").length;

  const GF = {
    all:      () => true,
    tosend:   g => g.delivered !== "Yes",
    delivered:g => g.delivered === "Yes",
    followup: g => g.delivered === "Yes" && g.booked !== "Yes",
    booked:   g => g.booked === "Yes",
    notes:    g => !!(g.notes || "").trim()
  };
  if(!GF[view.gf]) view.gf = "all";

  let list = glasses.filter(GF[view.gf]);
  if(view.gq){
    const q = view.gq.toLowerCase();
    list = list.filter(g =>
      (g.name + " " + g.company + " " + (g.notes || "")).toLowerCase().includes(q));
  }
  list.sort((a, b) => (a.name || "").localeCompare(b.name || ""));

  const n = f => glasses.filter(GF[f]).length;
  const chip = (k, l) =>
    `<button class="chip ${view.gf === k ? "on" : ""}" data-gf="${k}">${l} ${n(k)}</button>`;
  const off = (gState.loading || gState.busy) ? " disabled" : "";

  app.innerHTML = `
  ${chrome()}
  <p class="sub">Who has their glasses, and who turned into a meeting.
    <span class="gsync">${gState.loading ? "· syncing with Google Sheets…"
      : gState.error ? "· not synced" : gState.loaded ? "· synced with Google Sheets" : ""}</span></p>
  <div class="strip">
    <div class="stat"><b>${total}</b><span>Total recipients</span></div>
    <div class="stat ${del ? "good" : ""}"><b>${del}</b><span>Delivered</span></div>
    <div class="stat ${bk ? "good" : ""}"><b>${bk}</b><span>Meetings booked</span></div>
  </div>
  <div class="bar">
    ${chip("all","All")}${chip("tosend","To send")}${chip("delivered","Delivered")}
    ${chip("followup","Follow up")}${chip("booked","Booked")}${chip("notes","With notes")}
  </div>
  <div class="bar">
    <button class="btn add" id="addr"${off}>+ Add Recipient</button>
    <button class="btn" id="grefresh"${off}>${gState.loading ? "Refreshing…" : "Refresh"}</button>
    <input class="search" id="gq" placeholder="Search by name, company or notes…" value="${esc(view.gq)}">
  </div>
  <div class="panel">
    ${gState.error ? `<div class="gerr">
        <strong>Could not sync with the Google Sheet</strong>
        <p>${esc(gState.error)}</p>
        <button class="btn" id="gretry">Retry</button></div>`
     : gState.loading && !gState.loaded
     ? `<div class="gload"><span class="spin"></span>Loading recipients from Google Sheets…</div>`
     : list.length ? `<table class="gt${gState.busy ? " busy" : ""}"><thead><tr>
        <th>Name</th><th>Company</th><th>Address</th><th>Phone</th>
        <th>Delivered</th><th>Meeting booked</th><th></th></tr></thead><tbody>
      ${list.map(g => `<tr data-g="${esc(g.id)}">
        <td class="gt-name" data-l="Name">${esc(g.name) || "<span class='gt-mut'>Unnamed</span>"}
          ${(g.notes || "").trim() ? `<div class="gt-note">${esc(g.notes)}</div>` : ""}</td>
        <td data-l="Company">${esc(g.company) || "<span class='gt-mut'>—</span>"}</td>
        <td class="gt-mut" data-l="Address">${esc(g.address) || "—"}</td>
        <td class="gt-mut" data-l="Phone">${esc(g.phone) || "—"}</td>
        <td data-l="Delivered"><select class="yn" data-f="delivered" data-v="${esc(g.delivered)}">
          <option value="No"${g.delivered==="No"?" selected":""}>No</option>
          <option value="Yes"${g.delivered==="Yes"?" selected":""}>Yes</option></select></td>
        <td data-l="Meeting booked"><select class="yn" data-f="booked" data-v="${esc(g.booked)}">
          <option value="No"${g.booked==="No"?" selected":""}>No</option>
          <option value="Yes"${g.booked==="Yes"?" selected":""}>Yes</option></select></td>
        <td class="gt-act" data-l="">
          <button class="iconbtn" data-a="edit"${off}>Edit</button>
          <button class="iconbtn dg" data-a="del"${off}>Delete</button></td>
      </tr>`).join("")}</tbody></table>`
    : `<p class="empty">${total ? "No recipients match this filter or search."
        : "No recipients yet. Use Add Recipient to create the first one."}</p>`}
  </div>
  <p class="foot">Shared Google Sheet. Every change is written straight to it.
    Data &rarr; Export Backup saves a read-only snapshot.</p>`;

  wireChrome();
  document.getElementById("addr").onclick = () => glassesForm(null);
  document.getElementById("grefresh").onclick = () => glassesLoad();
  const rt = document.getElementById("gretry");
  if(rt) rt.onclick = () => { gState.error = null; glassesLoad(); };
  app.querySelectorAll("[data-gf]").forEach(b =>
    b.onclick = () => { view.gf = b.dataset.gf; glassesView(); });

  const gq = document.getElementById("gq");
  gq.oninput = e => {
    view.gq = e.target.value;
    const p = e.target.selectionStart;
    glassesView();
    const n = document.getElementById("gq");
    n.focus(); n.setSelectionRange(p, p);
  };

  app.querySelectorAll("tr[data-g]").forEach(tr => {
    const id = tr.dataset.g;
    tr.querySelectorAll("select[data-f]").forEach(sel => sel.onchange = () => {
      const g = glasses.find(x => x.id === id);
      if(!g || gState.busy) return;
      const patch = Object.assign({}, g);
      patch[sel.dataset.f] = sel.value;
      glassesSave("update", gToSheet(patch),
        sel.value === "Yes" ? "Marked Yes" : "Marked No");
    });
    tr.querySelector('[data-a="edit"]').onclick = () =>
      glassesForm(glasses.find(x => x.id === id));
    tr.querySelector('[data-a="del"]').onclick = () =>
      glassesDelete(glasses.find(x => x.id === id));
  });

  /* first visit to the tab pulls the sheet */
  if(!gState.loaded && !gState.loading && !gState.error) glassesLoad();
}

function glassesForm(rec){
  const g = rec || {id:"", name:"", company:"", address:"", phone:"", notes:"",
                    delivered:"No", booked:"No"};
  const yn = (f) => `<select id="f-${f}">
      <option value="No"${g[f]==="No"?" selected":""}>No</option>
      <option value="Yes"${g[f]==="Yes"?" selected":""}>Yes</option></select>`;

  modal(`<h3>${rec ? "Edit recipient" : "Add recipient"}</h3>
    <div class="fld"><label>Name</label>
      <input id="f-name" value="${esc(g.name)}" placeholder="Full name"></div>
    <div class="fld"><label>Company</label>
      <input id="f-company" value="${esc(g.company)}" placeholder="Company"></div>
    <div class="fld"><label>Address</label>
      <input id="f-address" value="${esc(g.address)}" placeholder="Shipping address"></div>
    <div class="fld"><label>Phone</label>
      <input id="f-phone" value="${esc(g.phone)}" placeholder="Phone"></div>
    <div class="fld2">
      <div class="fld"><label>Delivered</label>${yn("delivered")}</div>
      <div class="fld"><label>Meeting booked</label>${yn("booked")}</div>
    </div>
    <div class="fld"><label>Notes <span class="opt">optional</span></label>
      <textarea id="f-notes" placeholder="Anything worth remembering">${esc(g.notes)}</textarea></div>
    <div class="btns"><button class="btn" id="cx">Cancel</button>
      <button class="btn pri" id="sv">${rec ? "Save changes" : "Add recipient"}</button></div>`,
  o => {
    const nameEl = o.querySelector("#f-name");
    const svBtn = o.querySelector("#sv");
    const cxBtn = o.querySelector("#cx");
    nameEl.focus();
    let sending = false;

    const save = async () => {
      if(sending || gState.busy) return;            // blocks duplicate clicks
      const v = f => o.querySelector("#f-" + f).value.trim();
      if(!v("name") && !v("company")) return toast("Add a name or a company first");

      const data = {id: rec ? rec.id : "",
                    name:v("name"), company:v("company"), address:v("address"),
                    phone:v("phone"), notes:v("notes"),
                    delivered:o.querySelector("#f-delivered").value,
                    booked:o.querySelector("#f-booked").value};

      sending = true;
      svBtn.textContent = "Saving…";
      svBtn.setAttribute("disabled", "");
      cxBtn.setAttribute("disabled", "");

      const ok = await glassesSave(rec ? "update" : "create", gToSheet(data),
                                   rec ? "Recipient updated" : "Recipient added");
      sending = false;
      if(ok){ closeModal(); }
      else if(o.isConnected !== false){
        svBtn.textContent = rec ? "Save changes" : "Add recipient";
        svBtn.removeAttribute("disabled");
        cxBtn.removeAttribute("disabled");
      }
    };
    svBtn.onclick = save;
    cxBtn.onclick = () => { if(!sending) closeModal(); };
    o.querySelectorAll("input").forEach(i => i.onkeydown = e => {
      if(e.key === "Enter"){ e.preventDefault(); save(); }
    });
  });
}

function glassesDelete(rec){
  if(!rec) return;
  const who = rec.name || rec.company || "this recipient";
  modal(`<h3>Delete ${esc(who)}?</h3>
    <p>This removes the row from the shared Google Sheet for everyone. It cannot be
       undone. Your CRM data is not affected.</p>
    <div class="btns"><button class="btn" id="cx">Cancel</button>
      <button class="btn dg" id="go">Delete</button></div>`, o => {
    const goBtn = o.querySelector("#go"), cxBtn = o.querySelector("#cx");
    let sending = false;
    cxBtn.onclick = () => { if(!sending) closeModal(); };
    goBtn.onclick = async () => {
      if(sending || gState.busy) return;             // blocks duplicate clicks
      sending = true;
      goBtn.textContent = "Deleting…";
      goBtn.setAttribute("disabled", "");
      cxBtn.setAttribute("disabled", "");
      const ok = await glassesSave("delete", {ID: rec.id}, "Recipient deleted");
      sending = false;
      if(ok){ closeModal(); }
      else{
        goBtn.textContent = "Delete";
        goBtn.removeAttribute("disabled");
        cxBtn.removeAttribute("disabled");
      }
    };
  });
}

/* ============================================================
   THE "Data" MENU - import a meeting, refresh, export a snapshot
   ============================================================ */
function dataMenu(ev){
  const r = ev.currentTarget.getBoundingClientRect();
  openPop(r.right - 236, r.bottom + 6, `
    <div class="ph">Google Sheets</div>
    <button class="mi" data-a="imp">&#8679; Import meeting (JSON)</button>
    <button class="mi" data-a="ref">&#8635; Refresh everything</button>
    <hr>
    <div class="ph">Backup</div>
    <button class="mi" data-a="exp">&#8681; Export snapshot (JSON)</button>
    <div class="ph" style="padding-top:6px;font-weight:500;text-transform:none;letter-spacing:0">
      ${crm.syncedAt ? "Synced " + ago(crm.syncedAt) : "Not synced yet"}</div>`,
  p => {
    p.querySelector('[data-a="imp"]').onclick = () => { closePop(); importMeeting(); };
    p.querySelector('[data-a="ref"]').onclick = () => { closePop(); refreshAll(); };
    p.querySelector('[data-a="exp"]').onclick = () => { closePop(); exportBackup(); };
  });
}

/* ---------- read-only snapshot of what is currently loaded ---------- */
function backupBlob(){
  return JSON.stringify({
    _format: "meeting-crm-snapshot",
    _version: 3,
    exported: nowIso(),
    clients:  crmClients.map(cToSheet),
    meetings: crmMeetings.map(mToSheet),
    actions:  crmActions.map(aToSheet),
    glasses:  glasses
  }, null, 2);
}

function exportBackup(){
  const json = backupBlob();
  const fname = "meeting-crm-snapshot-" + iso(TODAY) + ".json";
  let downloaded = false;
  try{
    const url = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    downloaded = true;
  }catch(e){ downloaded = false; }

  modal(`<h3>Snapshot</h3>
    <p>${downloaded ? "Downloaded as <code>" + esc(fname) + "</code>. " : ""}A read-only copy of
      every row currently loaded from Google Sheets, plus the Glasses Tracker rows.
      The Sheet itself stays the source of truth.</p>
    <textarea id="bk" readonly>${esc(json)}</textarea>
    <div class="btns"><button class="btn" id="cp">Copy</button>
      <button class="btn pri" id="cl">Done</button></div>`, o => {
    o.querySelector("#cp").onclick = () => {
      const ta = o.querySelector("#bk");
      ta.select(); ta.setSelectionRange(0, ta.value.length);
      try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Select and copy manually"); }
    };
    o.querySelector("#cl").onclick = closeModal;
  });
}

/* ============================================================
   IMPORT MEETING - paste the JSON produced for a meeting
   ============================================================ */
function normalizeImport(d){
  if(!d || typeof d !== "object" || Array.isArray(d))
    throw new Error("The JSON must be an object with client / meeting / actions.");
  const client  = d.client  || d.Client  || {};
  const meeting = d.meeting || d.Meeting || {};
  let actions   = d.actions || d.Actions || [];
  if(!Array.isArray(actions)) throw new Error('"actions" must be an array.');
  actions = actions.filter(a => a && typeof a === "object" &&
    String(a.actionItem || a.action || "").trim());
  if(typeof client !== "object" || Array.isArray(client))
    throw new Error('"client" must be an object.');
  if(!String(client.clientId || "").trim() && !String(client.clientName || "").trim())
    throw new Error('"client" needs a clientId or a clientName.');
  return {client, meeting, actions};
}

function importPreview(p){
  const id = String(p.client.clientId || "").trim();
  let target = id ? getClient(id) : null;
  if(!target && p.client.clientName) target = clientByName(p.client.clientName);
  const hasMeeting = !!(p.meeting && (p.meeting.title || p.meeting.date ||
    p.meeting.summary || p.meeting.notes || p.meeting.meetingId));
  return {
    target: target,
    mode: target ? "update" : "create",
    name: (p.client.clientName || (target && target.Client) || id || "Unnamed client"),
    hasMeeting: hasMeeting,
    nActions: p.actions.length
  };
}

function importMeeting(preset){
  const seed = preset ? JSON.stringify({
    client: {clientId: preset._id, clientName: preset.Client},
    meeting: {date: iso(TODAY), title: "", participants: "", summary: "", notes: ""},
    actions: []
  }, null, 2) : "";

  modal(`<h3>Import meeting</h3>
    <p>Paste the JSON for this meeting. The client is matched on <b>Client ID</b> first,
      then on client name. <code>topics</code>, <code>decisions</code>, <code>risks</code>,
      <code>questions</code>, <code>type</code> and <code>transcript</code> are optional extras.</p>
    <textarea id="ta" placeholder='{ "client": { … }, "meeting": { … }, "actions": [ … ] }'>${esc(seed)}</textarea>
    <div id="pv"></div>
    <div class="btns"><button class="btn" id="cx">Cancel</button>
      <button class="btn pri" id="go">Preview</button></div>`, o => {
    const ta  = o.querySelector("#ta");
    const pv  = o.querySelector("#pv");
    const go  = o.querySelector("#go");
    const cx  = o.querySelector("#cx");
    let parsed = null, stage = "parse", sending = false;

    cx.onclick = () => { if(!sending) closeModal(); };
    ta.oninput = () => { if(stage === "confirm"){ stage = "parse"; go.textContent = "Preview";
      pv.innerHTML = ""; } };

    const log = steps => {
      pv.innerHTML = `<ul class="imp-log">${steps.map(s =>
        `<li><span class="${s.ok === true ? "ok" : s.ok === false ? "no" : "wa"}">${
          s.ok === true ? "&#10003;" : s.ok === false ? "&#10007;" : "…"}</span>
          <span>${esc(s.t)}${s.det ? `<small>${esc(s.det)}</small>` : ""}</span></li>`).join("")}</ul>`;
    };

    go.onclick = async () => {
      if(sending) return;

      if(stage === "parse"){
        let d;
        try{ d = JSON.parse(ta.value); }
        catch(err){ pv.innerHTML = `<div class="pv" style="color:var(--red)">That is not valid JSON: ${
          esc(err.message)}</div>`; return; }
        try{ parsed = normalizeImport(d); }
        catch(err){ pv.innerHTML = `<div class="pv" style="color:var(--red)">${esc(err.message)}</div>`; return; }

        const s = importPreview(parsed);
        pv.innerHTML = `<div class="pv">
          <b>Client:</b> ${esc(s.name)} — will be <b>${s.mode === "create" ? "created" : "updated"}</b><br>
          <b>${s.hasMeeting ? 1 : 0} Meeting</b>${s.hasMeeting ? "" : " (nothing to create)"}<br>
          <b>${s.nActions} Action${s.nActions === 1 ? "" : "s"}</b><br><br>
          Continue?</div>`;
        stage = "confirm";
        go.textContent = "Continue";
        return;
      }

      /* stage === "confirm" - actually write to the sheet */
      sending = true;
      go.textContent = "Saving…";
      go.setAttribute("disabled",""); cx.setAttribute("disabled","");
      const res = await runImport(parsed, log);
      sending = false;
      cx.removeAttribute("disabled");
      go.removeAttribute("disabled");

      if(res.failed === 0){
        go.textContent = "Done";
        go.onclick = () => { closeModal(); render(); };
        cx.textContent = "Close";
        if(res.clientId){ view.page = "client"; view.client = res.clientId; view.tab = "meetings"; }
        render();
      }else{
        go.textContent = "Retry failed steps";
        stage = "confirm";
        toast(res.failed + " step" + (res.failed === 1 ? "" : "s") + " failed");
      }
    };
  });
}

/* Writes in order: 1 Client, 2 Meeting, 3 Actions.
   Every step is reported. Nothing fails silently. */
async function runImport(p, log){
  const steps = [];
  const push = (t, ok, det) => { steps.push({t, ok, det}); log(steps); };
  let failed = 0;

  /* ---- 1. client ---- */
  const givenId = String(p.client.clientId || "").trim();
  let target = givenId ? getClient(givenId) : null;
  if(!target && p.client.clientName) target = clientByName(p.client.clientName);

  const FIELDS = [["clientName","Client"],["stage","Stage"],["lastMeeting","Last Meeting"],
    ["nextFollowUp","Next Follow-up"],["nextAction","Next Action"],
    ["actionOwner","Action Owner"],["status","Status"],["summary","Summary"],
    ["notes","Notes"]];

  let clientRec, mode;
  if(target){
    mode = "update";
    clientRec = Object.assign({}, target);
    FIELDS.forEach(([src, dst]) => {
      const v = p.client[src];
      if(v !== undefined && v !== null && String(v).trim() !== "") clientRec[dst] = String(v).trim();
    });
  }else{
    mode = "create";
    clientRec = {_id: givenId || newClientId(p.client.clientName),
      Client:"", Stage:"", "Last Meeting":"", "Next Follow-up":"", "Next Action":"",
      "Action Owner":"", Status:"", Summary:"", Notes:"", Meetings:"0",
      nextActionDone:false, snoozedUntil:"", Updated:""};
    FIELDS.forEach(([src, dst]) => {
      const v = p.client[src];
      if(v !== undefined && v !== null) clientRec[dst] = String(v).trim();
    });
  }
  clientRec["Last Meeting"]   = dstr(clientRec["Last Meeting"]);
  clientRec["Next Follow-up"] = dstr(clientRec["Next Follow-up"]);
  if(String(p.client.nextAction || "").trim()) clientRec.nextActionDone = false;
  clientRec.Updated = nowIso();
  const clientId = clientRec._id;

  push("Client · " + (clientRec.Client || clientId), null, mode === "create" ? "creating…" : "updating…");
  let ok = await gsSave("clients", mode, cToSheet(clientRec),
    mode === "create" ? "Client created" : "Client updated");
  steps.pop();
  push("Client · " + (clientRec.Client || clientId), ok,
    ok ? (mode === "create" ? "created" : "updated") : (crm.error || "write failed"));
  if(!ok) return {failed: 1, clientId: null};
  const ci = crmClients.findIndex(x => x._id === clientId);
  if(ci < 0) crmClients.push(clientRec); else crmClients[ci] = clientRec;

  /* ---- 2. meeting ---- */
  const mm = p.meeting || {};
  const wantMeeting = !!(mm.title || mm.date || mm.summary || mm.notes || mm.meetingId ||
    mm.participants);
  let meetingId = "";
  if(wantMeeting){
    const date = dstr(mm.date) || iso(TODAY);
    const meetingRec = {
      _id: String(mm.meetingId || "").trim(),
      clientId: clientId,
      date: date,
      name: String(mm.title || "").trim() || ("Meeting " + fmt(date)),
      participants: toPeople(mm.participants),
      summary: toLines(mm.summary),
      notes: toLines(mm.notes),
      topics: toLines(mm.topics), decisions: toLines(mm.decisions),
      risks: toLines(mm.risks), questions: toLines(mm.questions),
      type: String(mm.type || "Meeting").trim() || "Meeting",
      transcript: String(mm.transcript || "").trim(),
      createdAt: nowIso(), updatedAt: nowIso()
    };
    if(!meetingRec._id) meetingRec._id = newMeetingId(clientId, date);
    meetingId = meetingRec._id;
    const existing = getMeeting(meetingId);
    if(existing) meetingRec.createdAt = existing.createdAt || meetingRec.createdAt;

    push("Meeting · " + meetingRec.name, null, "saving…");
    ok = await meetingSave(meetingRec, existing ? "update" : "create", "Meeting saved");
    steps.pop();
    push("Meeting · " + meetingRec.name, ok,
      ok ? (existing ? "updated" : "created") + " · " + meetingId
         : (crm.error || "write failed"));
    if(!ok) return {failed: 1, clientId: clientId};
  }else{
    push("Meeting", null, "nothing in the JSON to create");
  }

  /* ---- 3. actions ---- */
  for(let i = 0; i < p.actions.length; i++){
    const src = p.actions[i];
    const rec = {
      _id: String(src.actionId || "").trim(),
      meetingId: meetingId,
      clientId: clientId,
      action: String(src.actionItem || src.action || "").trim(),
      owner: String(src.owner || "").trim() || "Unassigned",
      due: dstr(src.dueDate || src.due),
      status: normAStatus(src.status),
      updatedAt: nowIso()
    };
    if(!rec._id) rec._id = newActionId(meetingId || clientId);
    const existed = crmActions.some(a => a._id === rec._id);
    push("Action " + (i+1) + " · " + rec.action, null, "saving…");
    const aok = await actionSave(rec, existed ? "update" : "create", "Action saved");
    steps.pop();
    push("Action " + (i+1) + " · " + rec.action, aok,
      aok ? (existed ? "updated" : "created") : (crm.error || "write failed"));
    if(!aok) failed++;
  }

  /* ---- 4. keep the client card in step ---- */
  if(wantMeeting){
    push("Client meeting count & last meeting", null, "updating…");
    const sok = await syncClientMeetingStats(clientId, "Client updated");
    steps.pop();
    push("Client meeting count & last meeting", sok, sok ? "updated" : (crm.error || "write failed"));
    if(!sok) failed++;
  }

  return {failed: failed, clientId: clientId};
}

crmLoad();
